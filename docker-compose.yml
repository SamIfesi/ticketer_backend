version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketer-app
    restart: always
    ports:
      - "80:80"
    env_file:
      - .env
    volumes:
      # Persist generated tickets/QR codes/logs across deploys & restarts
      - storage_tickets:/var/www/html/storage/tickets
      - storage_qrcodes:/var/www/html/storage/qrcodes
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ticketer-net

  db:
    image: mysql:8.0
    container_name: ticketer-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASS}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASS}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DATABASE_ROOT_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketer-net
    # Remove this block once things are stable if you don't want
    # the DB port reachable from outside the VPS at all.
    ports:
      - "127.0.0.1:${DATABASE_PORT}:3306"

volumes:
  db_data:
  storage_tickets:
  storage_qrcodes:
  storage_logs:

networks:
  ticketer-net:
    driver: bridge